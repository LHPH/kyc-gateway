spring:
  application:
    name: kyc-gateway
  profiles:
    active: dev,check-encryption

server:
  port: 10000

management:
  endpoints:
    web:
      base-path: /gateway
      exposure:
        include: info,health
  info:
    build:
      enabled: false

logging:
  pattern:
    correlation: "[%X{kyc-correlation-id:-}]"
  level:
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: INFO
    org.springframework.cloud.gateway.handler.predicate.PathRoutePredicateFactory: INFO

kyc-messages:
  catalog:
    messages:
      "001":
        code: KYC-GTW-001
        message: Unexpected Error
        type: ERROR
      "002":
        code: KYC-GTW-002
        message: The request is unauthorized
        type: ERROR